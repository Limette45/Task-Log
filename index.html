<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Tracker</title>

<link rel="stylesheet" href="style.css">

<style>
/* =========================
   History
========================= */

#historyPage {
  display: none;
}

.history-section {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 20px;
  overflow-x: auto;
}

.history-section h2 {
  margin: 0 0 15px;
  font-size: 20px;
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 500px;
}

.history-table th,
.history-table td {
  border: 1px solid #ddd;
  padding: 8px 10px;
  text-align: center;
  white-space: nowrap;
}

.history-table th {
  background: #f5f7fa;
  font-weight: bold;
}

.history-table td:first-child,
.history-table th:first-child {
  text-align: left;
}

.history-empty {
  color: #777;
  padding: 5px 0;
}

/* =========================
   History button
========================= */

#openHistory,
#backToMain {
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 14px;
}

#openHistory:hover,
#backToMain:hover {
  background: #eee;
}

/* =========================
   Comment
========================= */

#dailyComment {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  resize: vertical;
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

#dailyComment:disabled {
  background: #f5f5f5;
  color: #555;
  cursor: default;
}

/* =========================
   Comment History
========================= */

.comment-history {
  margin-top: 20px;
}

.comment-history-item {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  background: #fafafa;
}

.comment-history-date {
  font-weight: bold;
  margin-bottom: 7px;
}

.comment-history-text {
  white-space: pre-wrap;
  line-height: 1.5;
}

.comment-history-empty {
  color: #777;
}
</style>

</head>

<body>

<div class="app">

  <!-- =========================
       MAIN PAGE
  ========================== -->

  <div id="mainPage">

    <div class="date-navigation">
      <button id="prevDay">←</button>

      <div id="dateDisplay"></div>

      <button id="nextDay">→</button>
    </div>


    <!-- =========================
         Vocab
    ========================== -->

    <section class="section">
      <h2>Vocab</h2>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="vocab"
          data-item="espDATA"
        >
        <span>espDATA</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="vocab"
          data-item="engDATA"
        >
        <span>engDATA</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="vocab"
          data-item="engSVL"
        >
        <span>engSVL</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="vocab"
          data-item="deuDATA"
        >
        <span>deuDATA</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="vocab"
          data-item="espA1-2"
        >
        <span>espA1-2</span>
      </label>
    </section>


    <!-- =========================
         Lang
    ========================== -->

    <section class="section">
      <h2>Lang</h2>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="lang"
          data-item="engNews"
        >
        <span>engNews</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="lang"
          data-item="engLyrics"
        >
        <span>engLyrics</span>
      </label>

      <label>
        <input
          type="checkbox"
          class="fixed-check"
          data-category="lang"
          data-item="espLyrics"
        >
        <span>espLyrics</span>
      </label>
    </section>


    <!-- =========================
         Review
    ========================== -->

    <section class="section">

      <div class="section-header">
        <h2>Review</h2>
        <button id="addReview">＋ Add</button>
      </div>

      <div id="reviewList"></div>

    </section>


    <!-- =========================
         Comment
    ========================== -->

    <section class="section">

      <h2>Comment</h2>

      <textarea
        id="dailyComment"
        placeholder="Write a comment for today..."
        rows="5"
      ></textarea>

    </section>


    <!-- =========================
         History Button
    ========================== -->

    <section class="section">

      <button id="openHistory">History</button>

    </section>

  </div>


  <!-- =========================
       HISTORY PAGE
  ========================== -->

  <div id="historyPage">

    <div class="date-navigation">
      <div style="font-size:22px; font-weight:bold;">
        History
      </div>

      <button id="backToMain">
        Back
      </button>
    </div>


    <!-- =========================
         Vocab History
    ========================== -->

    <section class="history-section">

      <h2>Vocab History</h2>

      <div id="vocabHistory"></div>

    </section>


    <!-- =========================
         Lang History
    ========================== -->

    <section class="history-section">

      <h2>Lang History</h2>

      <div id="langHistory"></div>

    </section>


    <!-- =========================
         Review History
    ========================== -->

    <section class="history-section">

      <h2>Review History</h2>

      <div id="reviewHistory"></div>

    </section>


    <!-- =========================
         Comment History
    ========================== -->

    <section class="history-section">

      <h2>Comment History</h2>

      <div id="commentHistory"></div>

    </section>

  </div>

</div>


<!-- =========================
     Existing JavaScript
========================== -->

<script src="script.js"></script>


<!-- =========================
     Comment + History
     HTML ONLY
========================== -->

<script>

(function () {

  const STORAGE_KEY = "studyRecordData";

  const vocabItems = [
    "espDATA",
    "engDATA",
    "engSVL",
    "deuDATA",
    "espA1-2"
  ];

  const langItems = [
    "engNews",
    "engLyrics",
    "espLyrics"
  ];


  /* =================================
     COMMENT
  ================================= */

  const commentBox =
    document.getElementById("dailyComment");


  function loadComment() {

    if (!commentBox) return;

    const record = data.records[currentDate];

    if (record && typeof record.comment === "string") {
      commentBox.value = record.comment;
    } else {
      commentBox.value = "";
    }

    commentBox.disabled = !isToday();
  }


  commentBox.addEventListener("input", function () {

    if (!isToday()) {
      loadComment();
      return;
    }

    const record = getRecord(currentDate);

    record.comment = commentBox.value;

    saveData();

  });


  /*
    The existing script's render() changes
    the current date when ← / → is pressed.

    Check for date changes and update Comment.
  */

  let lastCommentDate = currentDate;


  setInterval(function () {

    if (currentDate !== lastCommentDate) {

      lastCommentDate = currentDate;

      loadComment();

    }

    commentBox.disabled = !isToday();

  }, 100);


  loadComment();


  /* =================================
     HISTORY
  ================================= */

  const mainPage =
    document.getElementById("mainPage");

  const historyPage =
    document.getElementById("historyPage");

  const openHistory =
    document.getElementById("openHistory");

  const backToMain =
    document.getElementById("backToMain");


  function loadHistoryData() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {

        return {
          records: {},
          reviewSubjects: []
        };

      }

      const parsed =
        JSON.parse(saved);

      return {

        records:
          parsed.records || {},

        reviewSubjects:
          parsed.reviewSubjects || []

      };

    } catch (error) {

      console.error(
        "Failed to load history:",
        error
      );

      return {
        records: {},
        reviewSubjects: []
      };

    }

  }


  function getDates(historyData) {

    return Object.keys(
      historyData.records
    ).sort(function (a, b) {

      return b.localeCompare(a);

    });

  }


  function formatHistoryDate(dateString) {

    const parts =
      dateString.split("-");

    return (
      parts[1] +
      "/" +
      parts[2]
    );

  }


  function hasCheckedItems(record) {

    if (!record) return false;


    if (
      record.vocab &&
      Object.values(record.vocab)
        .some(Boolean)
    ) {

      return true;

    }


    if (
      record.lang &&
      Object.values(record.lang)
        .some(Boolean)
    ) {

      return true;

    }


    if (
      record.review &&
      Object.values(record.review)
        .some(Boolean)
    ) {

      return true;

    }


    if (
      typeof record.comment === "string" &&
      record.comment.trim() !== ""
    ) {

      return true;

    }


    return false;

  }


  function createHistoryTable(
    dates,
    items,
    category,
    historyData
  ) {

    const table =
      document.createElement("table");

    table.className =
      "history-table";


    const thead =
      document.createElement("thead");

    const headerRow =
      document.createElement("tr");


    const dateHeader =
      document.createElement("th");

    dateHeader.textContent =
      "Date";

    headerRow.appendChild(
      dateHeader
    );


    items.forEach(function (item) {

      const th =
        document.createElement("th");

      th.textContent = item;

      headerRow.appendChild(th);

    });


    thead.appendChild(headerRow);

    table.appendChild(thead);


    const tbody =
      document.createElement("tbody");


    dates.forEach(function (date) {

      const record =
        historyData.records[date];

      if (!record) return;


      const row =
        document.createElement("tr");


      const dateCell =
        document.createElement("td");

      dateCell.textContent =
        formatHistoryDate(date);

      row.appendChild(dateCell);


      items.forEach(function (
        item,
        index
      ) {

        const cell =
          document.createElement("td");


        let checked = false;


        if (
          category === "vocab" ||
          category === "lang"
        ) {

          checked =
            Boolean(
              record[category] &&
              record[category][item]
            );

        }


        /*
          Review is stored by numeric index
          in the existing script.js.
        */

        if (category === "review") {

          checked =
            Boolean(
              record.review &&
              record.review[index]
            );

        }


        cell.textContent =
          checked ? "✓" : "—";


        row.appendChild(cell);

      });


      tbody.appendChild(row);

    });


    table.appendChild(tbody);

    return table;

  }


  function renderVocabHistory(
    historyData
  ) {

    const container =
      document.getElementById(
        "vocabHistory"
      );

    container.innerHTML = "";


    const dates =
      getDates(historyData);


    if (dates.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "history-empty";

      empty.textContent =
        "No history yet.";

      container.appendChild(empty);

      return;

    }


    const table =
      createHistoryTable(
        dates,
        vocabItems,
        "vocab",
        historyData
      );


    container.appendChild(table);

  }


  function renderLangHistory(
    historyData
  ) {

    const container =
      document.getElementById(
        "langHistory"
      );

    container.innerHTML = "";


    const dates =
      getDates(historyData);


    if (dates.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "history-empty";

      empty.textContent =
        "No history yet.";

      container.appendChild(empty);

      return;

    }


    const table =
      createHistoryTable(
        dates,
        langItems,
        "lang",
        historyData
      );


    container.appendChild(table);

  }


  function renderReviewHistory(
    historyData
  ) {

    const container =
      document.getElementById(
        "reviewHistory"
      );

    container.innerHTML = "";


    const subjects =
      historyData.reviewSubjects;


    if (subjects.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "history-empty";

      empty.textContent =
        "No Review subjects yet.";

      container.appendChild(empty);

      return;

    }


    const dates =
      getDates(historyData);


    if (dates.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "history-empty";

      empty.textContent =
        "No history yet.";

      container.appendChild(empty);

      return;

    }


    const table =
      createHistoryTable(
        dates,
        subjects,
        "review",
        historyData
      );


    container.appendChild(table);

  }


  function renderCommentHistory(
    historyData
  ) {

    const container =
      document.getElementById(
        "commentHistory"
      );

    container.innerHTML = "";


    const dates =
      getDates(historyData);


    let hasComments = false;


    dates.forEach(function (date) {

      const record =
        historyData.records[date];


      if (
        !record ||
        typeof record.comment !== "string" ||
        record.comment.trim() === ""
      ) {

        return;

      }


      hasComments = true;


      const item =
        document.createElement("div");

      item.className =
        "comment-history-item";


      const dateElement =
        document.createElement("div");

      dateElement.className =
        "comment-history-date";

      dateElement.textContent =
        formatHistoryDate(date);


      const text =
        document.createElement("div");

      text.className =
        "comment-history-text";

      text.textContent =
        record.comment;


      item.appendChild(
        dateElement
      );

      item.appendChild(text);


      container.appendChild(item);

    });


    if (!hasComments) {

      const empty =
        document.createElement("div");

      empty.className =
        "comment-history-empty";

      empty.textContent =
        "No comments yet.";

      container.appendChild(empty);

    }

  }


  function renderHistory() {

    const historyData =
      loadHistoryData();


    renderVocabHistory(
      historyData
    );


    renderLangHistory(
      historyData
    );


    renderReviewHistory(
      historyData
    );


    renderCommentHistory(
      historyData
    );

  }


  /* =================================
     OPEN / CLOSE HISTORY
  ================================= */

  openHistory.addEventListener(
    "click",
    function () {

      renderHistory();

      mainPage.style.display =
        "none";

      historyPage.style.display =
        "block";

      window.scrollTo(
        0,
        0
      );

    }
  );


  backToMain.addEventListener(
    "click",
    function () {

      historyPage.style.display =
        "none";

      mainPage.style.display =
        "block";

      loadComment();

      window.scrollTo(
        0,
        0
      );

    }
  );


  /* =================================
     UPDATE HISTORY IF ANOTHER TAB
     CHANGES THE DATA
  ================================= */

  window.addEventListener(
    "storage",
    function (event) {

      if (
        event.key === STORAGE_KEY &&
        historyPage.style.display !== "none"
      ) {

        renderHistory();

      }

      if (
        event.key === STORAGE_KEY
      ) {

        loadComment();

      }

    }
  );


})();
</script>

</body>
</html>
