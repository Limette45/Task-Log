<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>
<link rel="stylesheet" href="style.css">

<style>
#historyPage {
    display: none;
}

#mainPage {
    transition: 0.2s;
}

.date-navigation {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
}

.date-navigation > button {
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    padding: 9px 15px;
    cursor: pointer;
    font-size: 15px;
    min-width: 48px;
}

.date-navigation > button:hover:not(:disabled) {
    background: #eee;
}

.date-navigation > button:disabled {
    opacity: 0.45;
    cursor: default;
}

.date-display-wrapper {
    min-width: 180px;
    text-align: center;
    padding: 10px 18px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: white;
    transition: 0.2s;
}

.date-display-wrapper.today {
    border-color: #222;
    background: #222;
    color: white;
}

#dateDisplay {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.2;
}

.today-badge {
    display: none;
    margin-top: 5px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

.date-display-wrapper.today .today-badge {
    display: block;
}

#todayButton {
    min-width: 62px;
    font-weight: bold;
}

#mainPage.today-page .section {
    border-color: #ddd;
}

#mainPage.today-page .date-navigation {
    margin-bottom: 28px;
}

.history-section {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
    overflow-x: auto;
}

.history-section h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
}

.history-table th,
.history-table td {
    border: 1px solid #ddd;
    padding: 8px 10px;
    text-align: center;
    white-space: nowrap;
}

.history-table th {
    background: #f5f7fa;
    font-weight: bold;
}

.history-table th:first-child,
.history-table td:first-child {
    text-align: left;
}

.history-empty {
    color: #777;
    padding: 5px 0;
}

#openHistory,
#backToMain {
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
}

#openHistory:hover,
#backToMain:hover {
    background: #eee;
}

#dailyComment {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    box-sizing: border-box;
}

#dailyComment:disabled {
    background: #f5f5f5;
    color: #555;
    cursor: default;
}

.comment-history-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fafafa;
}

.comment-history-date {
    font-weight: bold;
    margin-bottom: 7px;
}

.comment-history-text {
    white-space: pre-wrap;
    line-height: 1.5;
}

.comment-history-empty {
    color: #777;
}

@media (max-width: 600px) {
    .date-navigation {
        gap: 7px;
    }

    .date-navigation > button {
        padding: 9px 10px;
        min-width: 42px;
    }

    .date-display-wrapper {
        min-width: 145px;
        padding: 9px 12px;
    }

    #dateDisplay {
        font-size: 17px;
    }

    #todayButton {
        min-width: 58px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div id="mainPage">

        <div class="date-navigation">
            <button id="prevDay">←</button>

            <div id="dateDisplayWrapper" class="date-display-wrapper">
                <div id="dateDisplay"></div>
                <div class="today-badge">TODAY</div>
            </div>

            <button id="nextDay">→</button>
            <button id="todayButton">Today</button>
        </div>

        <section class="section">

            <h2>
                Board
            </h2>

            <textarea
                id="board"
                placeholder="Write something here..."
                rows="5"
            ></textarea>

        </section>

        <section class="section">

            <h2>
                Comment
            </h2>

            <textarea
                id="dailyComment"
                placeholder="Write a comment for today..."
                rows="5"
            ></textarea>

        </section>

        <section class="section">

            <div class="section-header">

                <h2>
                    Review
                </h2>

                <button id="addReview">
                    ＋ Add
                </button>

            </div>

            <div id="reviewList"></div>

        </section>

        <section class="section">

            <button id="openHistory">
                History
            </button>

        </section>

    </div>

    <div id="historyPage">

        <div class="date-navigation">

            <div
                style="
                    font-size:22px;
                    font-weight:bold;
                "
            >
                History
            </div>

            <button id="backToMain">
                Back
            </button>

        </div>

        <section class="history-section">

            <h2>
                Review History
            </h2>

            <div id="reviewHistory"></div>

        </section>

        <section class="history-section">

            <h2>
                Comment History
            </h2>

            <div id="commentHistory"></div>

        </section>

    </div>

</div>

<script src="script.js"></script>

<script>
(function () {

    const STORAGE_KEY = "studyRecordData";

    const commentBox =
        document.getElementById("dailyComment");

    function loadComment() {

        if (!commentBox) {
            return;
        }

        const record =
            data.records[currentDate];

        if (
            record &&
            typeof record.comment === "string"
        ) {
            commentBox.value =
                record.comment;
        } else {
            commentBox.value = "";
        }

        commentBox.disabled = false;
    }

    commentBox.addEventListener(
        "input",
        function () {

            const record =
                getRecord(currentDate);

            record.comment =
                commentBox.value;

            saveData();
        }
    );

    let lastCommentDate =
        currentDate;

    setInterval(
        function () {

            if (
                currentDate !==
                lastCommentDate
            ) {

                lastCommentDate =
                    currentDate;

                loadComment();
            }

            commentBox.disabled = false;

        },
        100
    );

    loadComment();

    const mainPage =
        document.getElementById(
            "mainPage"
        );

    const historyPage =
        document.getElementById(
            "historyPage"
        );

    const openHistory =
        document.getElementById(
            "openHistory"
        );

    const backToMain =
        document.getElementById(
            "backToMain"
        );

    function loadHistoryData() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!saved) {

                return {
                    records: {},
                    reviewSubjects: []
                };

            }

            const parsed =
                JSON.parse(saved);

            return {
                records:
                    parsed.records || {},

                reviewSubjects:
                    parsed.reviewSubjects || []
            };

        } catch (error) {

            console.error(
                "Failed to load history:",
                error
            );

            return {
                records: {},
                reviewSubjects: []
            };
        }
    }

    function getDates(historyData) {
        return getHistoryDates();
    }

    function formatHistoryDate(
        dateString
    ) {

        const parts =
            dateString.split("-");

        return (
            parts[1] +
            "/" +
            parts[2]
        );
    }

    function createHistoryTable(
        dates,
        items,
        historyData
    ) {

        const table =
            document.createElement(
                "table"
            );

        table.className =
            "history-table";

        const thead =
            document.createElement(
                "thead"
            );

        const headerRow =
            document.createElement(
                "tr"
            );

        const dateHeader =
            document.createElement(
                "th"
            );

        dateHeader.textContent =
            "Date";

        headerRow.appendChild(
            dateHeader
        );

        items.forEach(
            function (item) {

                const th =
                    document.createElement(
                        "th"
                    );

                th.textContent =
                    item;

                headerRow.appendChild(
                    th
                );
            }
        );

        thead.appendChild(
            headerRow
        );

        table.appendChild(
            thead
        );

        const tbody =
            document.createElement(
                "tbody"
            );

        dates.forEach(
            function (date) {

                const record =
                    historyData.records[date];

                const row =
                    document.createElement(
                        "tr"
                    );

                const dateCell =
                    document.createElement(
                        "td"
                    );

                dateCell.textContent =
                    formatHistoryDate(
                        date
                    );

                row.appendChild(
                    dateCell
                );

                items.forEach(
                    function (
                        item,
                        index
                    ) {

                        const cell =
                            document.createElement(
                                "td"
                            );

                        const checked =
                            Boolean(
                                record &&
                                record.review &&
                                record.review[index]
                            );

                        cell.textContent =
                            checked
                                ? "✅"
                                : "—";

                        row.appendChild(
                            cell
                        );
                    }
                );

                tbody.appendChild(
                    row
                );
            }
        );

        table.appendChild(
            tbody
        );

        return table;
    }

    function renderReviewHistory(
        historyData
    ) {

        const container =
            document.getElementById(
                "reviewHistory"
            );

        container.innerHTML = "";

        const subjects =
            historyData.reviewSubjects;

        if (
            subjects.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "history-empty";

            empty.textContent =
                "No Review subjects yet.";

            container.appendChild(
                empty
            );

            return;
        }

        const dates =
            getDates(historyData);

        const table =
            createHistoryTable(
                dates,
                subjects,
                historyData
            );

        container.appendChild(
            table
        );
    }

    function renderCommentHistory(
        historyData
    ) {

        const container =
            document.getElementById(
                "commentHistory"
            );

        container.innerHTML = "";

        const dates =
            getDates(historyData);

        let hasComments =
            false;

        dates.forEach(
            function (date) {

                const record =
                    historyData.records[date];

                if (
                    !record ||
                    typeof record.comment !== "string" ||
                    record.comment.trim() === ""
                ) {
                    return;
                }

                hasComments =
                    true;

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "comment-history-item";

                const dateElement =
                    document.createElement(
                        "div"
                    );

                dateElement.className =
                    "comment-history-date";

                dateElement.textContent =
                    formatHistoryDate(
                        date
                    );

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "comment-history-text";

                text.textContent =
                    record.comment;

                item.appendChild(
                    dateElement
                );

                item.appendChild(
                    text
                );

                container.appendChild(
                    item
                );
            }
        );

        if (!hasComments) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "comment-history-empty";

            empty.textContent =
                "No comments yet.";

            container.appendChild(
                empty
            );
        }
    }

    function renderHistory() {

        const historyData =
            loadHistoryData();

        renderReviewHistory(
            historyData
        );

        renderCommentHistory(
            historyData
        );
    }

    openHistory.addEventListener(
        "click",
        function () {

            renderHistory();

            mainPage.style.display =
                "none";

            historyPage.style.display =
                "block";

            window.scrollTo(
                0,
                0
            );
        }
    );

    backToMain.addEventListener(
        "click",
        function () {

            historyPage.style.display =
                "none";

            mainPage.style.display =
                "block";

            loadComment();

            window.scrollTo(
                0,
                0
            );
        }
    );

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key ===
                STORAGE_KEY
            ) {

                loadComment();

                if (
                    historyPage.style.display !==
                    "none"
                ) {
                    renderHistory();
                }
            }
        }
    );

})();
</script>

</body>
</html>
